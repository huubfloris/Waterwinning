<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waterwinning kaart</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<style>
html,body,#map{height:100%;margin:0}
.legend{background:#fff;padding:8px 10px;border-radius:4px;box-shadow:0 0 8px rgba(0,0,0,.2);line-height:1.4}
.legend .item{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.swatch{width:12px;height:12px;border-radius:50%;display:inline-block}
#nearestBtn{
    position:absolute;
    top:10px;
    right:10px;
    z-index:1000;
    padding:10px 12px;
    background:#c00000;
    color:#fff;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}  
</style>
</head>
<body>
<div id="map"></div>
<button id="nearestBtn">Dichtstbijzijnde waterwinning</button>  
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const map = L.map('map');

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19
}).addTo(map);

let userLat = null;
let userLng = null;
let alleMarkers = [];

// GPS locatie
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
        function(position) {

            userLat = position.coords.latitude;
            userLng = position.coords.longitude;

            map.setView([userLat,userLng],16);

            L.circleMarker([userLat,userLng],{
                radius:8,
                color:"#ffffff",
                weight:2,
                fillColor:"#007aff",
                fillOpacity:1
            })
            .addTo(map)
            .bindPopup("Uw locatie");

        },
        function(error){
            console.log(error);
            map.setView([52.08722,6.45778],14);
        },
        {
            enableHighAccuracy:true,
            timeout:15000,
            maximumAge:0
        }
    );
} else {
    map.setView([52.08722,6.45778],14);
}

const typeColors = {
    1:'#e74c3c',
    2:'#2980b9'
};

function typeNaam(code){
    return code==1 ? 'Brandkraan' :
           code==2 ? 'Geboorde put' : '-';
}

fetch('waterwinning.geojson')
.then(r => r.json())
.then(data => {

    const markers = L.markerClusterGroup();

    const gj = L.geoJSON(data,{
        pointToLayer:(f,latlng)=>{

            const p = f.properties;
            const c = Number(p.code_d);

            const col = typeColors[c] || '#888';

            const marker = L.circleMarker(latlng,{
                radius:6,
                color:col,
                fillColor:col,
                fillOpacity:0.9,
                weight:1
            });

            marker.bindPopup(
                `<b>${p.straat}</b><br>` +
                `${p.postcode} ${p.plaats}<hr>` +
                `Type: ${typeNaam(c)}<br>` +
                `Diameter: ${p.category} mm<br>` +
                `Volgnummer: ${p.code_c}`
            );

            alleMarkers.push(marker);

            return marker;
        }
    });

    markers.addLayer(gj);
    map.addLayer(markers);
});

// knop dichtstbijzijnde waterwinning

document.getElementById("nearestBtn").addEventListener("click", function() {

    if (!userLat || !userLng) {
        alert("Locatie nog niet beschikbaar");
        return;
    }

    let dichtstbij = null;
    let kortsteAfstand = Infinity;

    alleMarkers.forEach(function(marker){

        const afstand = map.distance(
            [userLat,userLng],
            marker.getLatLng()
        );

        if (afstand < kortsteAfstand) {
            kortsteAfstand = afstand;
            dichtstbij = marker;
        }
    });

if (dichtstbij) {

    dichtstbij.setStyle({
        radius: 12,
        color: "#ffff00",
        fillColor: "#ff0000",
        fillOpacity: 1,
        weight: 3
    });

    map.setView(dichtstbij.getLatLng(),18);

    dichtstbij.openPopup();

    alert(
        "Dichtstbijzijnde waterwinning\n\n" +
        "Afstand: " +
        Math.round(kortsteAfstand) +
        " meter"
    );
}

});

// legenda

const legend = L.control({position:'bottomleft'});

legend.onAdd = function(){

    const d = L.DomUtil.create('div','legend');

    d.innerHTML =
        '<b>Legenda</b><br>' +
        `<div class="item"><span class="swatch" style="background:${typeColors[1]}"></span> Brandkraan</div>` +
        `<div class="item"><span class="swatch" style="background:${typeColors[2]}"></span> Geboorde put</div>`;

    return d;
};

legend.addTo(map);

if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js');
}
</script>
</body></html>
