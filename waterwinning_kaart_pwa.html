<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waterwinning kaart</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<style>
html,body,#map{height:100%;margin:0}
.legend{background:#fff;padding:8px 10px;border-radius:4px;box-shadow:0 0 8px rgba(0,0,0,.2);line-height:1.4}
.legend .item{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.swatch{width:12px;height:12px;border-radius:50%;display:inline-block}
#buttonContainer{
    position:absolute;
    top:10px;
    right:10px;
    z-index:1000;
    display:flex;
    flex-direction:column;
    gap:6px;
}
#buttonContainer button{
    padding:10px;
    border:none;
    border-radius:6px;
    background:#c00000;
    color:white;
    font-weight:bold;
}
#infoBox{
    position:absolute;
    bottom:10px;
    right:10px;
    z-index:1000;
    width:250px;
    background:rgba(255,255,255,0.85);
    padding:10px;
    border-radius:6px;
    box-shadow:0 0 8px rgba(0,0,0,.25);
    font-size:14px;
}
.star-marker{
    font-size:24px;
    text-align:center;
    line-height:24px;
}
</style>
</head>
<body>
<div id="map"></div>
<div id="buttonContainer">
    <button onclick="zoekDichtstbijzijnde(1)">
        🔵 Brandkraan
    </button>
    <button onclick="zoekDichtstbijzijnde(2)">
        ⭐ Geboorde put
    </button>
</div>
<div id="infoBox" style="display:none;">
</div>
    
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const map = L.map('map');

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19
}).addTo(map);

let userLat = null;
let userLng = null;
let alleMarkers = [];
let geselecteerdeMarker = null;
let highlightRing = null;

// GPS locatie
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
        function(position) {

            userLat = position.coords.latitude;
            userLng = position.coords.longitude;

            map.setView([userLat,userLng],16);

            L.marker([userLat,userLng],{
                icon: L.divIcon({
                    html: '<div style="font-size:30px;">📍</div>',
                    className: '',
                    iconSize: [30,30],
                    iconAnchor: [15,30]
                })
})
.addTo(map)
.bindPopup("Uw locatie");


        },
        function(error){
            console.log(error);
            map.setView([52.08722,6.45778],14);
        },
        {
            enableHighAccuracy:true,
            timeout:15000,
            maximumAge:0
        }
    );
} else {
    map.setView([52.08722,6.45778],14);
}
function typeNaam(code){
    return code==1 ? 'Brandkraan' :
           code==2 ? 'Geboorde put' : '-';
}

fetch('waterwinning.geojson')
.then(r => r.json())
.then(data => {

    const markers = L.markerClusterGroup();

    const gj = L.geoJSON(data,{
        pointToLayer:(f,latlng)=>{

            const p = f.properties;
            const c = Number(p.code_d);
let marker;

if (c === 2) {

    // Geboorde put = ster
    marker = L.marker(latlng, {
        icon: L.divIcon({
            className: 'star-marker',
            html: '⭐',
            iconSize: [24,24],
            iconAnchor: [12,12]
        })
    });

} else {

    // Brandkraan = blauwe cirkel
    marker = L.circleMarker(latlng,{
        radius:6,
        color:"#0066ff",
        fillColor:"#0066ff",
        fillOpacity:0.9,
        weight:1
    });

}

            marker.bindPopup(
                `<b>${p.straat}</b><br>` +
                `${p.postcode} ${p.plaats}<hr>` +
                `Type: ${typeNaam(c)}<br>` +
                `Diameter: ${p.category} mm<br>` +
                `Volgnummer: ${p.code_c}`
            );

            alleMarkers.push(marker);

            return marker;
        }
    });

    markers.addLayer(gj);
    map.addLayer(markers);
});

// knop dichtstbijzijnde Brandkraan of Geboorde put

function zoekDichtstbijzijnde(filterType) {

    if (!userLat || !userLng) {
        alert("Locatie nog niet beschikbaar");
        return;
    }

    if (
    geselecteerdeMarker &&
    geselecteerdeMarker.setStyle
) {
    geselecteerdeMarker.setStyle({
    radius:6,
    color:"#0066ff",
    fillColor:"#0066ff",
    fillOpacity:0.9,
    weight:1
});
}
    let dichtstbij = null;
    let kortsteAfstand = Infinity;

    alleMarkers.forEach(function(marker){

        const popupText = marker.getPopup().getContent();

        if (
            filterType === 1 &&
            !popupText.includes("Brandkraan")
        ) return;

        if (
            filterType === 2 &&
            !popupText.includes("Geboorde put")
        ) return;

        const afstand = map.distance(
            [userLat,userLng],
            marker.getLatLng()
        );

        if (afstand < kortsteAfstand) {
            kortsteAfstand = afstand;
            dichtstbij = marker;
        }

    });

    if (!dichtstbij) return;
    geselecteerdeMarker = dichtstbij;
    if (dichtstbij.setStyle) {
        dichtstbij.setStyle({
            radius:12,
            color:"#00cc00",
            fillColor:"#0066ff",
            fillOpacity:0.9,
            weight:4
    });
}
    if (highlightRing) {
    map.removeLayer(highlightRing);
}

highlightRing = L.circleMarker(
    dichtstbij.getLatLng(),
    {
        radius:18,
        color:"#00cc00",
        weight:4,
        fillOpacity:0
    }
).addTo(map);

map.setView(dichtstbij.getLatLng(),18);

dichtstbij.openPopup();

    document.getElementById("infoBox").style.display = "block";

document.getElementById("infoBox").innerHTML =
    '<div style="text-align:right;">' +
    '<button onclick="sluitInfoBox()" style="border:none;background:none;font-size:20px;font-weight:bold;cursor:pointer;">✖</button>' +
    '</div>' +
    "<b>🚒 Resultaat</b><br><br>" +
    dichtstbij.getPopup().getContent() +
    "<br><br><b>Afstand:</b> " +
    Math.round(kortsteAfstand) +
    " meter";
}

function sluitInfoBox(){

    document.getElementById("infoBox").style.display = "none";

    if (highlightRing) {
        map.removeLayer(highlightRing);
        highlightRing = null;
    }

    map.closePopup();

}

// legenda

const legend = L.control({position:'bottomleft'});

legend.onAdd = function(){

    const d = L.DomUtil.create('div','legend');

   d.innerHTML =
'<b>Legenda</b><br>' +
'<div class="item">📍 Mijn locatie</div>' +
'<div class="item"><span class="swatch" style="background:#0066ff"></span> Brandkraan</div>' +
'<div class="item">⭐ Geboorde put</div>';

    return d;
};

legend.addTo(map);

if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js');
}
</script>
</body></html>
